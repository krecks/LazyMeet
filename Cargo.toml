# Workspace: lazymeet-core holds all backend domain logic (config, store,
# models, jobs, pipeline) with no Tauri dependency; src-tauri is the thin
# desktop shell exposing it as Tauri commands + events.
[workspace]
resolver = "2"
members = ["crates/lazymeet-core", "src-tauri"]

[profile.release]
opt-level = "s"
lto = true
strip = true
