# Workspace: lazymeet-core holds all backend domain logic (config, store,
# models, jobs, pipeline) with no Tauri dependency; src-tauri is the thin
# desktop shell exposing it as Tauri commands + events.
[workspace]
resolver = "2"
members = ["crates/lazymeet-core", "src-tauri"]

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = true
strip = true

# Build scripts and proc-macros never ship, and stripping them breaks the
# build on newer macOS: the stripped proc-macro dylibs are rejected by dyld
# ("mis-aligned LINKEDIT string pool") and rustc then reports E0463
# "can't find crate". The app binary above stays stripped.
[profile.release.build-override]
strip = false
