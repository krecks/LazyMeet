[package]
name = "lazymeet"
version = "0.1.0"
description = "Local, private meeting transcription & summaries"
authors = ["LazyMeet"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
