[package]
name = "lazymeet"
version = "0.1.6"
description = "Local, private meeting transcription & summaries"
license = "GPL-3.0-or-later"
authors = ["LazyMeet"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
lazymeet-core = { path = "../crates/lazymeet-core" }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# [profile.release] lives in the workspace root Cargo.toml.
