name: build

# Pushes to main run the (fast, model-free) core test suite only. The
# expensive installer builds — llama.cpp compiles from source (cmake),
# sherpa-onnx links the prebuilt static libs of its GitHub release (fetched by
# its build script), ffmpeg is fetched as a pinned static binary and bundled
# as a Tauri externalBin — run on version tags (v*) and manual dispatch,
# across a three-OS matrix (Tauri cannot cross-compile).
#
# A version tag additionally publishes a GitHub Release with the installers
# of all three platforms attached as downloadable assets.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # Fast gate: the whole behavioral test suite runs without the native ML
  # pipeline (no cmake, no llama.cpp build) in a couple of minutes.
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-node@v5
        with:
          # Vite 7 needs >= 20.19; pin it rather than rely on the runner image.
          node-version: 22
          cache: npm
      - name: Formatting (rustfmt.toml)
        run: cargo fmt --all --check
      - name: Frontend typecheck (tsc)
        run: npm ci && npm run typecheck
      - name: Frontend bundle (vite)
        run: npm run build
      - uses: Swatinem/rust-cache@v2
        with:
          # Save from main only: caches written under a tag ref are invisible
          # to future tags and would eat into the repo's cache quota.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Core test suite (FAKE pipeline)
        run: cargo test -p lazymeet-core --no-default-features --locked
      - name: Frontend smoke test (headless Chrome)
        env:
          SMOKE_REQUIRE_BROWSER: "1"
        run: ./scripts/smoke_frontend.sh

  build:
    # Installers only for version tags (and manual runs) — plain pushes to
    # main stop after the test job.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: windows-latest
          - os: ubuntu-22.04

    runs-on: ${{ matrix.os }}

    env:
      # Linux: dynamic-no-pic dates from sherpa-rs, whose source-built static
      # libs required it. The official sherpa-onnx static libs are PIC and
      # upstream CI links them without it, so it can go after a green Linux
      # build without it; kept until then.
      RUSTFLAGS: ${{ matrix.os == 'ubuntu-22.04' && '-C relocation-model=dynamic-no-pic' || matrix.os == 'windows-latest' && '-C target-feature=+crt-static -C link-arg=advapi32.lib' || '' }}
      # sherpa-onnx's prebuilt static libs use the static CRT (/MT) on Windows;
      # llama.cpp must match or the two can't link into one binary (LNK2038).
      LLAMA_STATIC_CRT: ${{ matrix.os == 'windows-latest' && '1' || '' }}

    steps:
      - uses: actions/checkout@v5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          # Restore the release cache the warm-cache workflow saves on main;
          # never save here (tag-scoped caches can't be reused by later tags).
          shared-key: release
          save-if: false

      - name: Linux system deps (webkit2gtk, etc.)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget \
            file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      # llama.cpp ignores the cmake crate's static_crt knob (its cmake
      # predates policy CMP0091) and stays on /MD while sherpa-onnx is /MT.
      # A toolchain file forces /MT everywhere (see the file for details).
      - name: Force static MSVC runtime for cmake deps (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: echo "CMAKE_TOOLCHAIN_FILE=$GITHUB_WORKSPACE/scripts/windows-static-crt.cmake" >> $GITHUB_ENV

      - name: Fetch bundled ffmpeg
        shell: bash
        # macOS: pin the triple to the explicit build target (see the --target
        # note on the build step) so the arm64 ffmpeg is what gets bundled.
        run: |
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            ./scripts/fetch_ffmpeg.sh aarch64-apple-darwin
          else
            ./scripts/fetch_ffmpeg.sh
          fi

      # Prebuilt binary in seconds — `cargo install` compiled the CLI from
      # source for ~5-10 min per platform. Falls back to a source build if no
      # prebuilt exists for the platform.
      - uses: cargo-bins/cargo-binstall@main
      - name: Install Tauri CLI
        run: cargo binstall tauri-cli --locked --no-confirm
      - uses: actions/setup-node@v5
        with:
          # Vite 7 needs >= 20.19; pin it rather than rely on the runner image.
          node-version: 22
          cache: npm
      - name: Install frontend deps
        # beforeBuildCommand runs `npm run build` (tsc + vite).
        run: npm ci

      - name: Build Tauri app
        # macOS: the target must be explicit. The prebuilt tauri-cli can run
        # under Rosetta and then resolves the bundle name and the externalBin
        # triple from its own x86_64 arch — v0.1.2 shipped as "x64.dmg" with
        # an x86_64 ffmpeg inside (needing Rosetta at runtime) because of it.
        run: cargo tauri build ${{ matrix.os == 'macos-latest' && '--target aarch64-apple-darwin' || '' }}
        working-directory: src-tauri

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: lazymeet-${{ matrix.os }}
          # `**` also matches zero segments, so these cover both the plain
          # layout (target/release/bundle) and the per-target layout an
          # explicit --target produces (target/<triple>/release/bundle).
          path: |
            target/**/release/bundle/**/*.dmg
            target/**/release/bundle/**/*.app
            target/**/release/bundle/**/*.msi
            target/**/release/bundle/**/*.exe
            target/**/release/bundle/**/*.AppImage
            target/**/release/bundle/**/*.deb
          if-no-files-found: ignore

  # On a version tag, gather the per-platform artifacts into one release.
  # Only installer files are attached (the bare .app directory stays a CI
  # artifact — macOS users download the .dmg).
  release:
    # Publish whatever platforms built — one failed platform must not block
    # the others' installers. Re-running the tag later updates the same
    # release with the missing assets.
    if: startsWith(github.ref, 'refs/tags/v') && !cancelled()
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: LazyMeet ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.msi
            artifacts/**/*.exe
            artifacts/**/*.AppImage
            artifacts/**/*.deb
