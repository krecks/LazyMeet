name: build

# Pushes to main run the (fast, model-free) core test suite only. The
# expensive installer builds — sherpa-onnx and llama.cpp compile from source
# (cmake), ffmpeg is fetched as a pinned static binary and bundled as a Tauri
# externalBin — run on version tags (v*) and manual dispatch, across a
# three-OS matrix (Tauri cannot cross-compile).
#
# A version tag additionally publishes a GitHub Release with the installers
# of all three platforms attached as downloadable assets.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # Fast gate: the whole behavioral test suite runs without the native ML
  # pipeline (no cmake, no llama.cpp build) in a couple of minutes.
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Save from main only: caches written under a tag ref are invisible
          # to future tags and would eat into the repo's cache quota.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Core test suite (FAKE pipeline)
        run: cargo test -p lazymeet-core --no-default-features --locked

  build:
    # Installers only for version tags (and manual runs) — plain pushes to
    # main stop after the test job.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: windows-latest
          - os: ubuntu-22.04

    runs-on: ${{ matrix.os }}

    env:
      # sherpa-rs' static build needs this relocation model on Linux.
      RUSTFLAGS: ${{ matrix.os == 'ubuntu-22.04' && '-C relocation-model=dynamic-no-pic' || matrix.os == 'windows-latest' && '-C target-feature=+crt-static -C link-arg=advapi32.lib' || '' }}
      # sherpa-onnx's static build uses the static CRT (/MT) on Windows; llama.cpp
      # must match or the two can't link into one binary (LNK2038).
      LLAMA_STATIC_CRT: ${{ matrix.os == 'windows-latest' && '1' || '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          # Restore the release cache the warm-cache workflow saves on main;
          # never save here (tag-scoped caches can't be reused by later tags).
          shared-key: release
          save-if: false

      - name: Linux system deps (webkit2gtk, etc.)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget \
            file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      # sherpa-onnx 1.12.9's cmake calls wmic for OS info; new runner images
      # removed it (deprecated), which crashes the configure step. Restore it.
      - name: Restore wmic (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: DISM /Online /Add-Capability /CapabilityName:WMIC~~~~

      - name: Fetch bundled ffmpeg
        shell: bash
        run: ./scripts/fetch_ffmpeg.sh

      # Prebuilt binary in seconds — `cargo install` compiled the CLI from
      # source for ~5-10 min per platform. Falls back to a source build if no
      # prebuilt exists for the platform.
      - uses: cargo-bins/cargo-binstall@main
      - name: Install Tauri CLI
        run: cargo binstall tauri-cli --locked --no-confirm

      - name: Build Tauri app
        run: cargo tauri build
        working-directory: src-tauri

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lazymeet-${{ matrix.os }}
          path: |
            target/release/bundle/**/*.dmg
            target/release/bundle/**/*.app
            target/release/bundle/**/*.msi
            target/release/bundle/**/*.exe
            target/release/bundle/**/*.AppImage
            target/release/bundle/**/*.deb
          if-no-files-found: ignore

  # On a version tag, gather the per-platform artifacts into one release.
  # Only installer files are attached (the bare .app directory stays a CI
  # artifact — macOS users download the .dmg).
  release:
    # Publish whatever platforms built — one failed platform must not block
    # the others' installers. Re-running the tag later updates the same
    # release with the missing assets.
    if: startsWith(github.ref, 'refs/tags/v') && !cancelled()
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: LazyMeet ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.msi
            artifacts/**/*.exe
            artifacts/**/*.AppImage
            artifacts/**/*.deb
