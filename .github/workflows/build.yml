name: build

# Builds the cross-platform desktop installers. The backend is pure Rust
# (lazymeet-core) compiled into the Tauri binary — sherpa-onnx and llama.cpp
# build from source (cmake), ffmpeg is fetched as a pinned static binary and
# bundled as a Tauri externalBin. (Tauri cannot cross-compile, hence the
# matrix.)
#
# Pushing a version tag (v*) additionally publishes a GitHub Release with the
# installers of all three platforms attached as downloadable assets.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # Fast gate: the whole behavioral test suite runs without the native ML
  # pipeline (no cmake, no llama.cpp build) in a couple of minutes.
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Core test suite (FAKE pipeline)
        run: cargo test -p lazymeet-core --no-default-features

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: windows-latest
          - os: ubuntu-22.04

    runs-on: ${{ matrix.os }}

    env:
      # sherpa-rs' static build needs this relocation model on Linux.
      RUSTFLAGS: ${{ matrix.os == 'ubuntu-22.04' && '-C relocation-model=dynamic-no-pic' || '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Linux system deps (webkit2gtk, etc.)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget \
            file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Fetch bundled ffmpeg
        shell: bash
        run: ./scripts/fetch_ffmpeg.sh

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build Tauri app
        run: cargo tauri build
        working-directory: src-tauri

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lazymeet-${{ matrix.os }}
          path: |
            target/release/bundle/**/*.dmg
            target/release/bundle/**/*.app
            target/release/bundle/**/*.msi
            target/release/bundle/**/*.exe
            target/release/bundle/**/*.AppImage
            target/release/bundle/**/*.deb
          if-no-files-found: ignore

  # On a version tag, gather the per-platform artifacts into one release.
  # Only installer files are attached (the bare .app directory stays a CI
  # artifact — macOS users download the .dmg).
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: LazyMeet ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.msi
            artifacts/**/*.exe
            artifacts/**/*.AppImage
            artifacts/**/*.deb
