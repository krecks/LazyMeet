name: warm-cache

# Release builds run only on tags, but GitHub cache scoping means a tag run
# can restore caches only from its own ref or from main. This MANUAL workflow
# fills the release cache (sherpa-onnx + llama.cpp compile from source) from
# main — run it from the Actions tab before tagging a release whenever
# dependencies changed, and the tag build restores it instead of compiling
# cold. Pushes to main never build anything; they only run the test job.

on:
  workflow_dispatch:

jobs:
  warm:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: windows-latest
          - os: ubuntu-22.04

    runs-on: ${{ matrix.os }}

    env:
      # Must mirror the release build exactly — different RUSTFLAGS or a
      # different macOS deployment target would produce cache entries the tag
      # build can't (or worse, shouldn't) reuse. 12.0 matches
      # bundle.macOS.minimumSystemVersion, which `cargo tauri build` exports.
      RUSTFLAGS: ${{ matrix.os == 'ubuntu-22.04' && '-C relocation-model=dynamic-no-pic' || matrix.os == 'windows-latest' && '-C target-feature=+crt-static -C link-arg=advapi32.lib' || '' }}
      # sherpa-onnx's static build uses the static CRT (/MT) on Windows; llama.cpp
      # must match or the two can't link into one binary (LNK2038).
      LLAMA_STATIC_CRT: ${{ matrix.os == 'windows-latest' && '1' || '' }}
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.os == 'macos-latest' && '12.0' || '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
          # A partial cache still saves the next run real time.
          cache-on-failure: true

      - name: Linux system deps (webkit2gtk, etc.)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget \
            file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      # sherpa-onnx 1.12.9's cmake calls wmic for OS info; new runner images
      # removed it (deprecated), which crashes the configure step. Restore it.
      - name: Restore wmic (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: DISM /Online /Add-Capability /CapabilityName:WMIC~~~~

      # llama.cpp ignores the cmake crate's static_crt knob (its cmake
      # predates policy CMP0091) and stays on /MD while sherpa-onnx is /MT.
      # A toolchain file forces /MT everywhere (see the file for details).
      - name: Force static MSVC runtime for cmake deps (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: echo "CMAKE_TOOLCHAIN_FILE=$GITHUB_WORKSPACE/scripts/windows-static-crt.cmake" >> $GITHUB_ENV

      # tauri-build validates bundle.externalBin at compile time — the ffmpeg
      # binary must exist even though nothing is bundled here.
      - name: Fetch bundled ffmpeg
        shell: bash
        run: ./scripts/fetch_ffmpeg.sh

      - name: Build release workspace (fills the cache)
        # macOS mirrors the release build's explicit --target (see build.yml):
        # cargo puts artifacts under target/<triple>/ when a target is passed,
        # and the cache is only useful if it's filled under the same path.
        run: cargo build --release --workspace --locked ${{ matrix.os == 'macos-latest' && '--target aarch64-apple-darwin' || '' }}
