name: warm-cache

# Release builds run only on tags, but GitHub cache scoping means a tag run
# can restore caches only from its own ref or from main. This workflow keeps
# the expensive release target dir (sherpa-onnx + llama.cpp compile from
# source) warm on main — and runs only when dependencies actually change, so
# ordinary pushes to main still just run the fast test job.

on:
  push:
    branches: [main]
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**/Cargo.toml"
      - "src-tauri/Cargo.toml"
      - ".github/workflows/warm-cache.yml"
  workflow_dispatch:

jobs:
  warm:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: windows-latest
          - os: ubuntu-22.04

    runs-on: ${{ matrix.os }}

    env:
      # Must mirror the release build exactly — different RUSTFLAGS or a
      # different macOS deployment target would produce cache entries the tag
      # build can't (or worse, shouldn't) reuse. 12.0 matches
      # bundle.macOS.minimumSystemVersion, which `cargo tauri build` exports.
      RUSTFLAGS: ${{ matrix.os == 'ubuntu-22.04' && '-C relocation-model=dynamic-no-pic' || matrix.os == 'windows-latest' && '-C link-arg=advapi32.lib' || '' }}
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.os == 'macos-latest' && '12.0' || '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
          # A partial cache still saves the next run real time.
          cache-on-failure: true

      - name: Linux system deps (webkit2gtk, etc.)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget \
            file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      # sherpa-onnx 1.12.9's cmake calls wmic for OS info; new runner images
      # removed it (deprecated), which crashes the configure step. Restore it.
      - name: Restore wmic (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: DISM /Online /Add-Capability /CapabilityName:WMIC~~~~

      # tauri-build validates bundle.externalBin at compile time — the ffmpeg
      # binary must exist even though nothing is bundled here.
      - name: Fetch bundled ffmpeg
        shell: bash
        run: ./scripts/fetch_ffmpeg.sh

      - name: Build release workspace (fills the cache)
        run: cargo build --release --workspace --locked
